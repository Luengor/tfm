[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "exifread>=3.5.1",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.6",
    "jupyterlab-vim>=4.1.4",
    "matplotlib>=3.10.8",
    "ninja>=1.13.0",
    "numpy>=2.4.3",
    "open-clip-torch>=3.3.0",
    "pandas>=3.0.1",
    "pgvector>=0.4.2",
    "pip>=26.0.1",
    "psutil>=6.1.1",
    "psycopg2-binary>=2.9.11",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.0",
    "sqlalchemy>=2.0.49",
    "torch==2.10.0",
    "tqdm>=4.67.3",
    "transformers>=5.7.0",
    "ultralytics>=8.4.26",
    "umap-learn>=0.5.12",
]

[project.scripts]
pipeline-benchmark = "src.evaluation.benchmark:main"
pipeline-plot = "src.evaluation.plot_metrics:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
